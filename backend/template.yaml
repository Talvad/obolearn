AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: OboLearn B2C LMS — Phase 1 Backend

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 512
    Timeout: 30
    Architectures:
      - arm64
    Environment:
      Variables:
        # TABLE_NAME: !Ref OboLearnTable
        # BUCKET_NAME: !Ref VideoBucket
        # CLOUDFRONT_DOMAIN: !GetAtt CloudFrontDistribution.DomainName
        # CLOUDFRONT_KEY_PAIR_ID: !Ref CloudFrontKeyPairId
        # CLOUDFRONT_PRIVATE_KEY_SSM_PATH: !Sub "/obolearn/${Stage}/cloudfront/private-key"
        CORS_ORIGIN: !Sub "https://${FrontendDomain}"

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
  FrontendDomain:
    Type: String
    Default: "localhost:3000"
    Description: Frontend domain for CORS (without https://)
  CloudFrontKeyPairId:
    Type: String
    Description: CloudFront key pair ID for signing video URLs

# ---------------------------------------------------------------------------
# API Gateway
# ---------------------------------------------------------------------------
Resources:
  OboLearnApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${FrontendDomain}"
          - "http://localhost:3000"
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowCredentials: true
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
        DefaultAuthorizer: CognitoAuthorizer

  # ---------------------------------------------------------------------------
  # Cognito — Task 2
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "obolearn-${Stage}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: false
          Mutable: true
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "obolearn-web-${Stage}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: days
        IdToken: days
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool
      Description: LMS administrators and instructors

  PostConfirmationFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PostConfirmationFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # ---------------------------------------------------------------------------
  # DynamoDB — Task 3
  # ---------------------------------------------------------------------------
  OboLearnTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "obolearn-${Stage}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ---------------------------------------------------------------------------
  # S3 + CloudFront — Task 4
  # ---------------------------------------------------------------------------
  VideoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "obolearn-videos-${Stage}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Sub "https://${FrontendDomain}"
              - "http://localhost:3000"
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3000

  VideoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref VideoBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${VideoBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "obolearn-oac-${Stage}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "OboLearn video CDN (${Stage})"
        HttpVersion: http2and3
        DefaultCacheBehavior:
          TargetOriginId: S3VideoOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # CORS-S3Origin
          TrustedKeyGroups:
            - !Ref CloudFrontKeyGroup
        Origins:
          - Id: S3VideoOrigin
            DomainName: !GetAtt VideoBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
        PriceClass: PriceClass_100

  CloudFrontKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Name: !Sub "obolearn-keygroup-${Stage}"
        Items:
          - !Ref CloudFrontKeyPairId
        Comment: Key group for signed video URLs

  # ---------------------------------------------------------------------------
  # Lambda functions
  # ---------------------------------------------------------------------------

  # Auth — post-confirmation trigger
  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Sourcemap: false
        EntryPoints:
          - src/functions/auth/postConfirmation.ts
    Properties:
      FunctionName: !Sub "obolearn-post-confirmation-${Stage}"
      Handler: postConfirmation.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OboLearnTable
      Environment:
        Variables:
          TABLE_NAME: !Ref OboLearnTable

  # CoursesFunctions
  CoursesFunctions:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Sourcemap: false
        EntryPoints:
          - src/functions/courses.ts
    Properties:
      FunctionName: !Sub "obolearn-courses-${Stage}"
      Handler: courses.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OboLearnTable
      Environment:
        Variables:
          TABLE_NAME: !Ref OboLearnTable
      Events:
        ListPublicCourses:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /public/courses
            Method: GET
            Auth:
              Authorizer: NONE
        ListAdminCourses:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /courses
            Method: GET
        CreateCourse:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /courses
            Method: POST
        GetPublicCourse:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /public/courses/{courseId}
            Method: GET
            Auth:
              Authorizer: NONE
        GetAdminCourse:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /courses/{courseId}
            Method: GET
        UpdateCourse:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /courses/{courseId}
            Method: PUT

  # LessonFunctions
  LessonFunctions:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Sourcemap: false
        EntryPoints:
          - src/functions/lessons.ts
    Properties:
      FunctionName: !Sub "obolearn-lessons-${Stage}"
      Handler: lessons.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OboLearnTable
        - S3WritePolicy:
            BucketName: !Ref VideoBucket
      Environment:
        Variables:
          TABLE_NAME: !Ref OboLearnTable
          BUCKET_NAME: !Ref VideoBucket
      Events:
        CreateLesson:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /courses/{courseId}/lessons
            Method: POST
        ListPublicLessons:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /public/courses/{courseId}/lessons
            Method: GET
            Auth:
              Authorizer: NONE
        ListAdminLessons:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /courses/{courseId}/lessons
            Method: GET
        UpdateLesson:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /courses/{courseId}/lessons/{lessonId}
            Method: PUT
        GetUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /courses/{courseId}/lessons/{lessonId}/upload-url
            Method: POST

  # EnrollmentsFunctions
  EnrollmentFunctions:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Sourcemap: false
        EntryPoints:
          - src/functions/enrollments.ts
    Properties:
      FunctionName: !Sub "obolearn-enrollments-${Stage}"
      Handler: enrollments.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OboLearnTable
      Environment:
        Variables:
          TABLE_NAME: !Ref OboLearnTable
      Events:
        CreateEnrollment:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /enrollments
            Method: POST
        ListEnrollments:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /enrollments
            Method: GET
        GetEnrollments:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /enrollments/{courseId}
            Method: GET

  # ProgressFunctions
  ProgressFunctions:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Sourcemap: false
        EntryPoints:
          - src/functions/progress.ts
    Properties:
      FunctionName: !Sub "obolearn-progress-${Stage}"
      Handler: progress.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OboLearnTable
      Environment:
        Variables:
          TABLE_NAME: !Ref OboLearnTable
      Events:
        UpdateProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /progress/{courseId}/{lessonId}
            Method: PUT
        GetProgress:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /progress/{courseId}
            Method: GET

  # Video signed URL
  GetVideoSignedUrlFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2022"
        Sourcemap: false
        EntryPoints:
          - src/functions/video.ts
    Properties:
      FunctionName: !Sub "obolearn-get-video-signed-url-${Stage}"
      Handler: video.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OboLearnTable
        - SSMParameterReadPolicy:
            ParameterName: !Sub "obolearn/${Stage}/cloudfront/private-key"
      Environment:
        Variables:
          TABLE_NAME: !Ref OboLearnTable
          BUCKET_NAME: !Ref VideoBucket
          CLOUDFRONT_DOMAIN: !GetAtt CloudFrontDistribution.DomainName
          CLOUDFRONT_KEY_PAIR_ID: !Ref CloudFrontKeyPairId
          CLOUDFRONT_PRIVATE_KEY_SSM_PATH: !Sub "/obolearn/${Stage}/cloudfront/private-key"
          CORS_ORIGIN: !Sub "https://${FrontendDomain}"
      Events:
        GetVideoSignedUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref OboLearnApi
            Path: /videos/{lessonId}/signed-url
            Method: GET

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${OboLearnApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "OboLearn-ApiUrl-${Stage}"

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub "OboLearn-UserPoolId-${Stage}"

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "OboLearn-UserPoolClientId-${Stage}"

  VideoBucketName:
    Description: S3 bucket for video uploads
    Value: !Ref VideoBucket
    Export:
      Name: !Sub "OboLearn-VideoBucket-${Stage}"

  CloudFrontDomain:
    Description: CloudFront distribution domain
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub "OboLearn-CloudFrontDomain-${Stage}"

  TableName:
    Description: DynamoDB table name
    Value: !Ref OboLearnTable
    Export:
      Name: !Sub "OboLearn-TableName-${Stage}"
